<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Creator · The Tavern</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a08">
  <link rel="icon" href="../../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow+Semi+Condensed:ital,wght@0,300;0,400;0,500;1,300&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../hub.css">
</head>
<body class="hub creator-page">
  <div class="haze" aria-hidden="true"></div>
  <header class="hub-bar">
    <a class="hub-home" id="back" href="../profile/">&larr; Profile</a>
    <span class="hub-home">Create a character</span>
  </header>

  <main class="cc" id="creator">
    <nav class="cc-tabs" id="tabs" role="tablist" aria-label="Creation steps"></nav>
    <p class="hub-status" id="status" role="status" aria-live="polite"></p>
    <div class="cc-grid">
      <section class="cc-list" id="list" aria-label="Options"></section>
      <section class="cc-stage" id="stage" aria-label="Your character"></section>
      <aside class="cc-info" id="info" aria-label="Details"></aside>
    </div>
    <footer class="cc-foot">
      <ul class="cc-problems" id="problems"></ul>
      <div class="cc-nav">
        <button class="cc-btn" id="prev" type="button">Back</button>
        <button class="cc-btn cc-next" id="next" type="button">Next</button>
      </div>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../common.js"></script>
  <script src="options.js"></script>
  <script src="catalogue.js"></script>
  <script src="descriptions.js"></script>
  <script src="notes-text.js"></script>
  <script src="create.js"></script>
</body>
</html>
