<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character · The Tavern</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a08">
  <link rel="icon" href="../../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow+Semi+Condensed:ital,wght@0,300;0,400;0,500;1,300&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../hub.css">
</head>
<body class="hub">
  <div class="haze" aria-hidden="true"></div>

  <!-- Line-art icons on stone tiles: each path is drawn twice, a blurred glow under a bright core -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <symbol id="i-sheet" viewBox="0 0 48 48"><path d="M13 9h20c3 0 5 2 5 5v2h-5M13 9c-3 0-5 2-5 5s2 5 5 5h2M15 14v23c0 2 2 4 4 4h20c-3 0-4-2-4-4V14M20 20h10M20 26h10M20 32h6"/></symbol>
    <symbol id="i-pack" viewBox="0 0 48 48"><path d="M16 13c0-5 3-9 8-9s8 4 8 9M10 18h28l-2 23c0 1-1 2-2 2H14c-1 0-2-1-2-2zM10 18c0-3 2-5 5-5h18c3 0 5 2 5 5M18 26h12v8H18zM24 26v-4M14 43v-6M34 43v-6"/></symbol>
    <symbol id="i-journal" viewBox="0 0 48 48"><path d="M6 11c7-3 13-2 18 3 5-5 11-6 18-3v29c-7-3-13-2-18 3-5-5-11-6-18-3zM24 14v29M11 19c3-1 6-1 9 1M11 25c3-1 6-1 9 1M28 20c3-2 6-2 9-1M33 3l7 2-9 17-3 2 0-4z"/></symbol>
    <symbol id="i-sword" viewBox="0 0 48 48"><path d="M42 6l-3 9-19 19-6-6 19-19zM39 9L22 26M9 23c3 5 7 9 16 16M7 25l-2-3M25 41l-3 2M15 33l-8 8M4 42l2 2 2-2-2-2z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 48 48"><path d="M24 5c5 3 10 4 16 4 0 16-5 27-16 34C13 36 8 25 8 9c6 0 11-1 16-4zM24 15l2 6h6l-5 4 2 6-5-4-5 4 2-6-5-4h6z"/></symbol>
    <symbol id="i-bow" viewBox="0 0 48 48"><path d="M13 5c16 6 22 13 22 19s-6 13-22 19M13 5c3 6 4 12 4 19s-1 13-4 19M7 24h34M37 19l5 5-5 5M7 24l-3-4M7 24l-3 4"/></symbol>
    <symbol id="i-helm" viewBox="0 0 48 48"><path d="M9 31c0-14 7-24 15-24s15 10 15 24v9l-6-3H15l-6 3zM9 31h30M24 7v24M17 31v6M31 31v6M20 9c-4-4-10-4-13 1M28 9c4-4 10-4 13 1"/></symbol>
    <symbol id="i-cloak" viewBox="0 0 48 48"><path d="M17 7h14l3 5c5 7 7 18 7 29l-6-3-5 3-6-3-6 3-5-3-6 3c0-11 2-22 7-29zM17 7c2 4 4 5 7 5s5-1 7-5M24 12v26"/></symbol>
    <symbol id="i-armour" viewBox="0 0 48 48"><path d="M15 7l9 5 9-5 9 7-5 8v19l-13 4-13-4V22L6 14zM15 7c2 5 5 7 9 7s7-2 9-7M11 29c8 3 18 3 26 0M24 14v29"/></symbol>
    <symbol id="i-glove" viewBox="0 0 48 48"><path d="M13 43V23a3 3 0 0 1 6 0V12a3 3 0 0 1 6 0v9V9a3 3 0 0 1 6 0v13l5-5a3 3 0 0 1 4 4l-9 11v11zM13 37h18"/></symbol>
    <symbol id="i-boot" viewBox="0 0 48 48"><path d="M15 5h13v22l12 6c2 1 3 3 3 5v4H8v-9l7-5zM15 13h13M15 20h13M8 37h35"/></symbol>
    <symbol id="i-amulet" viewBox="0 0 48 48"><path d="M11 5c0 11 5 18 13 20 8-2 13-9 13-20M24 25v3M24 28l8 8-8 9-8-9zM24 32l4 4-4 5-4-5z"/></symbol>
    <symbol id="i-ring" viewBox="0 0 48 48"><path d="M10 31a14 11 0 1 0 28 0a14 11 0 1 0-28 0zM16 31a8 6 0 1 0 16 0a8 6 0 1 0-16 0zM24 20l-6-7 6-8 6 8zM18 13h12"/></symbol>
    <symbol id="i-potion" viewBox="0 0 48 48"><path d="M18 5h12M20 5v10c-8 3-12 10-12 17a16 16 0 0 0 32 0c0-7-4-14-12-17V5M9 30c5-3 10 3 15 0s10-3 15 0M19 37a2 2 0 1 0 4 0a2 2 0 1 0-4 0M27 35a3 3 0 1 0 6 0a3 3 0 1 0-6 0"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 48 48"><path d="M11 9h24c3 0 5 2 5 5s-2 5-5 5h-3M32 9c-2 0-4 2-4 5v22c0 3-2 5-5 5H9c-3 0-5-2-5-5s2-5 5-5h17M11 9c-3 0-5 2-5 5v16M13 17h10M13 23h10M13 29h6"/></symbol>
    <symbol id="i-tool" viewBox="0 0 48 48"><path d="M7 15l11-9 9 6-5 5 19 19-5 5-19-19-5 5zM18 6l-3 12"/></symbol>
    <symbol id="i-gem" viewBox="0 0 48 48"><path d="M14 9h20l9 11-19 22L5 20zM5 20h38M19 9l-4 11 9 22 9-22-4-11M24 9v11M40 4l2-2M44 9h2M8 4L6 2"/></symbol>
    <symbol id="i-pouch" viewBox="0 0 48 48"><path d="M17 9h14l-3 6c9 3 14 11 14 18 0 7-8 10-18 10S6 40 6 33c0-7 5-15 14-18zM20 15h8M17 9l-3-5M31 9l3-5M24 25l4 5-4 5-4-5z"/></symbol>
    <symbol id="i-coin" viewBox="0 0 48 48"><path d="M8 24a16 16 0 1 0 32 0a16 16 0 1 0-32 0zM14 24a10 10 0 1 0 20 0a10 10 0 1 0-20 0zM24 18l4 6-4 6-4-6z"/></symbol>
  </svg>

  <header class="hub-bar">
    <a class="hub-home" id="back" href="../">&larr; The Tavern</a>
    <div class="hub-who">
      <button class="link-button" id="edit-toggle" type="button" hidden>Edit</button>
      <button class="button button-quiet" id="save" type="button" hidden>Save</button>
    </div>
  </header>

  <main class="hub-main sheet-main">
    <p class="hub-status" id="status" role="status" aria-live="polite"></p>

    <div class="sheet-frame">
      <div class="sheet">
        <!-- Header: portrait with level, HP and AC; name; abilities -->
        <header class="sheet-head">
          <div class="portrait-block">
            <div class="portrait" id="portrait"><svg class="portrait-sigil glyph" viewBox="0 0 48 48"><use class="g-glow" href="#i-sheet"/><use class="g-core" href="#i-sheet"/></svg></div>
            <span class="badge-prof" id="prof" title="Proficiency bonus">+2</span>
            <span class="badge-level" id="level" title="Level">1</span>
            <div class="hp" title="Hit points">
              <div class="hp-bar"><span class="hp-fill" id="hp-fill"></span><span class="hp-text" id="hp-text">0 / 0</span></div>
              <div class="hp-sub"><span id="hp-temp">TMP</span><span>MAX</span></div>
            </div>
          </div>
          <div class="sheet-title">
            <div class="title-row">
              <div>
                <h1 class="sheet-name" id="char-name">&hellip;</h1>
                <p class="sheet-line" id="char-line"></p>
                <p class="sheet-owner" id="char-owner"></p>
              </div>
              <div class="ac" title="Armour class"><span class="ac-label">AC</span><span id="ac">10</span></div>
            </div>
            <div class="abilities" id="abilities"></div>
          </div>
        </header>

        <div class="sheet-body">
          <aside class="sheet-side" id="side"></aside>

          <div class="sheet-content">
            <section class="dash-panel" data-panel="sheet">
              <div class="feature-search"><input id="search" type="search" placeholder="Search features" aria-label="Search features"></div>
              <div id="tables"></div>
              <section class="edit-only" id="basics" hidden>
                <h3 class="table-head">Details</h3>
                <form class="form sheet-form" id="basics-form" novalidate></form>
                <button class="link-button remove" id="delete" type="button">Delete this character</button>
              </section>
            </section>
            <section class="dash-panel" data-panel="inventory" hidden>
              <h3 class="table-head">Inventory</h3>
              <div class="tab-body tab-inventory" id="inventory"></div>
            </section>
            <section class="dash-panel" data-panel="inspiration" hidden>
              <h3 class="table-head">Inspiration</h3>
              <div class="tab-body tab-inspiration" id="inspiration"></div>
            </section>
            <section class="dash-panel" data-panel="journal" hidden>
              <h3 class="table-head">Journal</h3>
              <div class="tab-body tab-journal" id="journal"></div>
            </section>
          </div>
        </div>
      </div>

      <nav class="dash-rail" role="tablist" aria-label="Character dashboard">
        <button role="tab" aria-selected="true" data-tab="sheet" title="Character sheet"><svg class="tile glyph" viewBox="0 0 48 48"><use class="g-glow" href="#i-sheet"/><use class="g-core" href="#i-sheet"/></svg></button>
        <button role="tab" aria-selected="false" data-tab="inventory" title="Inventory"><svg class="tile glyph" viewBox="0 0 48 48"><use class="g-glow" href="#i-pack"/><use class="g-core" href="#i-pack"/></svg></button>
        <button role="tab" aria-selected="false" data-tab="inspiration" title="Inspiration"><span class="tile tile-img"><img src="../icons/ui/inspiration.webp" alt=""></span></button>
        <button role="tab" aria-selected="false" data-tab="journal" title="Journal"><svg class="tile glyph" viewBox="0 0 48 48"><use class="g-glow" href="#i-journal"/><use class="g-core" href="#i-journal"/></svg></button>
      </nav>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../common.js"></script>
  <script src="panels.js"></script>
  <script src="character.js"></script>
</body>
</html>
