<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character · The Tavern</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a08">
  <link rel="icon" href="../../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow+Semi+Condensed:ital,wght@0,300;0,400;0,500;1,300&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../hub.css">
</head>
<body class="hub">
  <div class="haze" aria-hidden="true"></div>

  <!-- Line-art icons on dark tiles: drawn with strokes only, glowing red -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-sheet" viewBox="0 0 48 48"><path d="M14 8h20v32H14zM14 8c-3 0-4 2-4 4s1 4 4 4M34 40c3 0 4-2 4-4s-1-4-4-4M19 16h10M19 22h10M19 28h7M24 34l2-2 2 2-2 2z"/></symbol>
    <symbol id="i-pack" viewBox="0 0 48 48"><path d="M16 14c0-5 3-8 8-8s8 3 8 8M11 18h26l-2 22H13zM11 18c0-2 2-4 5-4h16c3 0 5 2 5 4M19 26h10v6H19zM24 26v-3"/></symbol>
    <symbol id="i-flame" viewBox="0 0 48 48"><path d="M24 6c2 7 10 11 10 21a10 10 0 0 1-20 0c0-5 3-8 5-10 0 4 2 6 4 6-2-6 0-12 1-17zM24 40c-3 0-5-2-5-5 0-3 3-5 5-8 2 3 5 5 5 8 0 3-2 5-5 5zM8 20l3 2M40 20l-3 2M24 2v2"/></symbol>
    <symbol id="i-journal" viewBox="0 0 48 48"><path d="M8 12c6-2 11-1 16 3 5-4 10-5 16-3v26c-6-2-11-1-16 3-5-4-10-5-16-3zM24 15v26M30 6l8 2-10 18-3 1 1-3z"/></symbol>
    <symbol id="i-sword" viewBox="0 0 48 48"><path d="M40 8l-2 8-18 18-6-6 18-18zM12 26l10 10M10 34l4 4M14 34l-7 7M33 11l4 4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 48 48"><path d="M24 6l15 5c0 14-5 24-15 31C14 35 9 25 9 11zM24 6v36M10 20h28"/></symbol>
    <symbol id="i-bow" viewBox="0 0 48 48"><path d="M14 6c14 6 20 13 20 18s-6 12-20 18M14 6v36M6 24h34M36 20l4 4-4 4M10 21l-4 3 4 3"/></symbol>
    <symbol id="i-helm" viewBox="0 0 48 48"><path d="M10 30c0-12 6-22 14-22s14 10 14 22v8H10zM10 30h28M24 8v16M18 30v8M30 30v8"/></symbol>
    <symbol id="i-cloak" viewBox="0 0 48 48"><path d="M18 8h12l2 4c6 6 8 18 8 28H8c0-10 2-22 8-28zM18 8c2 3 4 4 6 4s4-1 6-4M24 12v28M16 40l2-14M32 40l-2-14"/></symbol>
    <symbol id="i-armour" viewBox="0 0 48 48"><path d="M16 8l8 4 8-4 8 6-4 8v18H12V22l-4-8zM16 8c2 4 5 6 8 6s6-2 8-6M12 30h24M24 14v26"/></symbol>
    <symbol id="i-glove" viewBox="0 0 48 48"><path d="M14 42V22a3 3 0 0 1 6 0V12a3 3 0 0 1 6 0v8-10a3 3 0 0 1 6 0v12l4-4a3 3 0 0 1 4 4l-8 10v10zM14 36h20"/></symbol>
    <symbol id="i-boot" viewBox="0 0 48 48"><path d="M16 6h12v22l12 6v8H10v-8l6-4zM16 14h12M10 36h30"/></symbol>
    <symbol id="i-amulet" viewBox="0 0 48 48"><path d="M12 6c0 10 5 16 12 18 7-2 12-8 12-18M24 24v4M24 28l6 7-6 7-6-7zM24 32v6"/></symbol>
    <symbol id="i-ring" viewBox="0 0 48 48"><path d="M12 30a12 12 0 1 0 24 0a12 12 0 1 0-24 0zM17 30a7 7 0 1 0 14 0a7 7 0 1 0-14 0zM24 18l-5-6 5-6 5 6z"/></symbol>
    <symbol id="i-potion" viewBox="0 0 48 48"><path d="M19 6h10M21 6v10c-7 3-11 9-11 15a14 14 0 0 0 28 0c0-6-4-12-11-15V6M11 29h26M20 35l2 2M28 33l1 1"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 48 48"><path d="M12 10h22c3 0 4 2 4 4s-1 4-4 4M34 10v28c0 2-2 4-4 4H10c-3 0-4-2-4-4s1-4 4-4h20M12 10c-3 0-4 2-4 4v20M16 18h12M16 24h12M16 30h8"/></symbol>
    <symbol id="i-tool" viewBox="0 0 48 48"><path d="M8 14l10-8 8 6-4 4 18 18-4 4-18-18-4 4zM18 6l-2 10"/></symbol>
    <symbol id="i-gem" viewBox="0 0 48 48"><path d="M14 10h20l8 10-18 20L6 20zM6 20h36M18 10l-4 10 10 20 10-20-4-10"/></symbol>
    <symbol id="i-pouch" viewBox="0 0 48 48"><path d="M18 10h12l-3 6c8 3 13 10 13 17 0 6-7 9-16 9S8 39 8 33c0-7 5-14 13-17zM21 16h6M18 10l-2-4M30 10l2-4M24 26l3 4-3 4-3-4z"/></symbol>
    <symbol id="i-coin" viewBox="0 0 48 48"><path d="M8 24a16 16 0 1 0 32 0a16 16 0 1 0-32 0zM14 24a10 10 0 1 0 20 0a10 10 0 1 0-20 0zM24 18l4 6-4 6-4-6z"/></symbol>
  </svg>

  <header class="hub-bar">
    <a class="hub-home" id="back" href="../">&larr; The Tavern</a>
    <div class="hub-who">
      <button class="link-button" id="edit-toggle" type="button" hidden>Edit</button>
      <button class="button button-quiet" id="save" type="button" hidden>Save</button>
    </div>
  </header>

  <main class="hub-main sheet-main">
    <p class="hub-status" id="status" role="status" aria-live="polite"></p>

    <div class="sheet-frame">
      <div class="sheet">
        <!-- Header: portrait with level, HP and AC; name; abilities -->
        <header class="sheet-head">
          <div class="portrait-block">
            <div class="portrait" id="portrait"><svg class="portrait-sigil" viewBox="0 0 48 48"><use href="#i-sheet"/></svg></div>
            <span class="badge-prof" id="prof" title="Proficiency bonus">+2</span>
            <span class="badge-level" id="level" title="Level">1</span>
            <div class="hp" title="Hit points">
              <div class="hp-bar"><span class="hp-fill" id="hp-fill"></span><span class="hp-text" id="hp-text">0 / 0</span></div>
              <div class="hp-sub"><span id="hp-temp">TMP</span><span>MAX</span></div>
            </div>
          </div>
          <div class="sheet-title">
            <div class="title-row">
              <div>
                <h1 class="sheet-name" id="char-name">&hellip;</h1>
                <p class="sheet-line" id="char-line"></p>
                <p class="sheet-owner" id="char-owner"></p>
              </div>
              <div class="ac" title="Armour class"><span class="ac-label">AC</span><span id="ac">10</span></div>
            </div>
            <div class="abilities" id="abilities"></div>
          </div>
        </header>

        <div class="sheet-body">
          <aside class="sheet-side" id="side"></aside>

          <div class="sheet-content">
            <section class="dash-panel" data-panel="sheet">
              <div class="feature-search"><input id="search" type="search" placeholder="Search features" aria-label="Search features"></div>
              <div id="tables"></div>
              <section class="edit-only" id="basics" hidden>
                <h3 class="table-head">Details</h3>
                <form class="form sheet-form" id="basics-form" novalidate></form>
                <button class="link-button remove" id="delete" type="button">Delete this character</button>
              </section>
            </section>
            <section class="dash-panel" data-panel="inventory" hidden>
              <h3 class="table-head">Inventory</h3>
              <div class="tab-body tab-inventory" id="inventory"></div>
            </section>
            <section class="dash-panel" data-panel="inspiration" hidden>
              <h3 class="table-head">Inspiration</h3>
              <div class="tab-body tab-inspiration" id="inspiration"></div>
            </section>
            <section class="dash-panel" data-panel="journal" hidden>
              <h3 class="table-head">Journal</h3>
              <div class="tab-body tab-journal" id="journal"></div>
            </section>
          </div>
        </div>
      </div>

      <nav class="dash-rail" role="tablist" aria-label="Character dashboard">
        <button role="tab" aria-selected="true" data-tab="sheet" title="Character sheet"><svg class="tile"><use href="#i-sheet"/></svg></button>
        <button role="tab" aria-selected="false" data-tab="inventory" title="Inventory"><svg class="tile"><use href="#i-pack"/></svg></button>
        <button role="tab" aria-selected="false" data-tab="inspiration" title="Inspiration"><svg class="tile"><use href="#i-flame"/></svg></button>
        <button role="tab" aria-selected="false" data-tab="journal" title="Journal"><svg class="tile"><use href="#i-journal"/></svg></button>
      </nav>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../common.js"></script>
  <script src="panels.js"></script>
  <script src="character.js"></script>
</body>
</html>
