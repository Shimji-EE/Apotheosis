<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apotheosis Hub</title>
  <meta name="description" content="The Apotheosis campaign hub: sign in for the DM and players.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a08">
  <link rel="icon" href="../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow+Semi+Condensed:ital,wght@0,300;0,400;0,500;1,300&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="hub.css">
</head>
<body class="hub">
  <div class="haze" aria-hidden="true"></div>

  <header class="hub-bar">
    <a class="hub-home" href="../">&larr; Apotheosis</a>
    <div class="hub-who" id="who" hidden>
      <span id="who-name"></span>
      <span class="tab" id="who-role"></span>
      <button class="link-button" id="logout" type="button">Log out</button>
    </div>
  </header>

  <main class="hub-main">
    <p class="tracked">The Charred Eye</p>
    <h1 class="hub-title">Campaign Hub</h1>
    <p class="hub-status" id="status" role="status" aria-live="polite"></p>

    <!-- Logged out -->
    <section class="panel" id="login-panel" hidden>
      <h2>Sign in</h2>
      <form id="login-form" class="form">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button" type="submit">Enter</button>
      </form>
      <details class="setup">
        <summary>First time setup (DM only)</summary>
        <p>The first account ever made becomes the DM. After that, the DM adds players from inside the hub.</p>
        <form id="setup-form" class="form">
          <label>Username <input name="username" autocomplete="username" required pattern="[a-z0-9_]{3,24}" title="3 to 24 lowercase letters, numbers or underscores"></label>
          <label>Display name <input name="display_name" maxlength="40"></label>
          <label>Password <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
          <button class="button button-quiet" type="submit">Claim the DM seat</button>
        </form>
      </details>
    </section>

    <!-- Logged in -->
    <section class="panel" id="party-panel" hidden>
      <h2>The party</h2>
      <ul class="roster" id="roster"></ul>
      <form id="rename-form" class="form form-inline">
        <label>Your display name <input name="display_name" maxlength="40" required></label>
        <button class="button button-quiet" type="submit">Save</button>
      </form>
    </section>

    <section class="panel" id="dm-panel" hidden>
      <h2>Add a player</h2>
      <p>Pick their username and a starting password, then send both to them privately.</p>
      <form id="add-form" class="form">
        <label>Username <input name="username" required pattern="[a-z0-9_]{3,24}" title="3 to 24 lowercase letters, numbers or underscores"></label>
        <label>Display name <input name="display_name" maxlength="40"></label>
        <label>Starting password <input name="password" type="text" minlength="8" required autocomplete="off"></label>
        <button class="button" type="submit">Add player</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="hub.js"></script>
</body>
</html>
